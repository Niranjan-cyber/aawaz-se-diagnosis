<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Aawaz se Diagnosis: Galat jawab nahi. Galat soch pakdo.">
  <defs>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#e6eefa"/>
      <stop offset="1" stop-color="#f5f2ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#f5f2ec"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#e3ded3"/>

  <!-- wordmark -->
  <text x="80" y="92" font-family="'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', sans-serif" font-size="34" fill="#12110f">आवाज़</text>
  <text x="190" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#6e6a62">se Diagnosis</text>

  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#12110f">
    <tspan x="78" y="190">Galat jawab nahi.</tspan>
    <tspan x="78" y="265">Galat <tspan fill="#1d5fbf" font-style="italic">soch</tspan> pakdo.</tspan>
  </text>
  <text x="80" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#6e6a62">Hear how a learner thinks. Name the misconception. Fix it out loud.</text>

  <!-- model pills -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2a2824">
    <rect x="80" y="338" width="104" height="32" rx="16" fill="#ece8e0"/><circle cx="99" cy="354" r="4" fill="#1d5fbf"/><text x="111" y="359">Saaras</text>
    <rect x="194" y="338" width="148" height="32" rx="16" fill="#ece8e0"/><circle cx="213" cy="354" r="4" fill="#12110f"/><text x="225" y="359">Sarvam-105B</text>
    <rect x="352" y="338" width="100" height="32" rx="16" fill="#ece8e0"/><circle cx="371" cy="354" r="4" fill="#e8960c"/><text x="383" y="359">Bulbul</text>
  </g>

  <!-- waveform -->
  <g fill="#1d5fbf" opacity="0.9">
    <rect x="760" y="300" width="6" height="20" rx="3"/><rect x="774" y="290" width="6" height="40" rx="3"/>
    <rect x="788" y="280" width="6" height="60" rx="3"/><rect x="802" y="294" width="6" height="32" rx="3"/>
    <rect x="816" y="272" width="6" height="76" rx="3"/><rect x="830" y="286" width="6" height="48" rx="3"/>
    <rect x="844" y="298" width="6" height="24" rx="3"/><rect x="858" y="282" width="6" height="56" rx="3"/>
    <rect x="872" y="292" width="6" height="36" rx="3"/><rect x="886" y="302" width="6" height="16" rx="3"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="760" y="96" width="330" height="92" rx="20" fill="#ffffff" stroke="#e3ded3"/>
    <path d="M1060 188 L1082 212 L1040 188 Z" fill="#ffffff" stroke="#e3ded3"/>
    <rect x="1041" y="184" width="22" height="6" fill="#ffffff"/>
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#12110f">
      <tspan x="784" y="134">Namaste, main Bulbul hoon!</tspan>
      <tspan x="784" y="164" fill="#6e6a62">Wrong answers are welcome here.</tspan>
    </text>
  </g>

  <!-- Bulbul the guide (same drawing as the app) -->
  <g transform="translate(1030 170) scale(1.9)">
    <path d="M38 78 L10 96 L16 100 L42 90 Z" fill="#5d4f41"/>
    <ellipse cx="44" cy="92" rx="7" ry="4.5" fill="#d6322b"/>
    <ellipse cx="60" cy="74" rx="30" ry="27" fill="#7d6b57"/>
    <path d="M40 66 Q56 58 70 72 Q58 90 40 84 Z" fill="#665645"/>
    <ellipse cx="68" cy="82" rx="19" ry="16" fill="#fbf6ec"/>
    <path d="M56 99 v8 M66 99 v8 M52 107 h8 M62 107 h8" stroke="#e8960c" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 30 L63 6 L78 27 Z" fill="#1f1d1a"/>
    <circle cx="70" cy="44" r="21" fill="#1f1d1a"/>
    <ellipse cx="77" cy="53" rx="9" ry="6.5" fill="#ffffff"/>
    <circle cx="84" cy="44" r="3.4" fill="#d6322b"/>
    <path d="M70 41 q4 -5 8 0" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M89 43 L99 45 L89 50 Q93 46 89 43 Z" fill="#f0a33a"/>
    <ellipse cx="80" cy="56" rx="4" ry="2.4" fill="#f4a3a0" opacity=".8"/>
  </g>
</svg>
